<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookBot Insight</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <aside class="left-panel" aria-label="Book panel">
            <header class="panel-header">
                <h1>BookBot Insight</h1>
                <p class="subtitle">Upload your book and ask precise questions.</p>
            </header>

            <form id="upload-form" class="upload-form" aria-label="Upload book file">
                <input type="text" id="book-title" placeholder="Book title (optional)">
                <input type="text" id="book-author" placeholder="Author (optional)">
                <input type="file" id="book-file" accept=".pdf,.txt,.md,.text" required>
                <button type="submit" id="upload-btn">Upload Book File</button>
            </form>

            <div class="book-row">
                <select id="book-select" aria-label="Select a book"></select>
                <button type="button" id="refresh-books-btn">Refresh</button>
            </div>
        </aside>

        <section class="chat-panel" aria-label="Chat panel">
            <section id="chat-box" aria-live="polite" aria-label="Chat messages"></section>

            <form class="input-area" id="chat-form" aria-label="Ask BookBot">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask something about your selected book..."
                    autocomplete="off"
                    aria-label="Message for BookBot"
                    required
                >
                <button type="submit" id="send-btn" aria-label="Send message">Send</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
